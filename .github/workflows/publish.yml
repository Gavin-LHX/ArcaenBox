name: Publish verified ArcaenBox APKs
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful signed APK workflow run to publish without rebuilding
        required: true
      expected_sha:
        description: Exact source commit of the signed APKs
        required: true
      verification_runs:
        description: Comma-separated successful UI runs testing those exact APKs
        required: true
      tag:
        description: Release tag matching the APK version
        required: true
      notes_path:
        description: Reviewed release notes under docs/releases
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable source and completed regressions
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERIFICATION_RUNS: ${{ inputs.verification_runs }}
          RELEASE_TAG: ${{ inputs.tag }}
          NOTES_PATH: ${{ inputs.notes_path }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)
          repo = os.environ['GITHUB_REPOSITORY']
          source = os.environ['SOURCE_RUN']
          expected = os.environ['EXPECTED_SHA']
          runs = os.environ['VERIFICATION_RUNS'].split(',')
          assert re.fullmatch(r'\d+', source)
          assert re.fullmatch(r'[0-9a-f]{40}', expected)
          assert len(runs) >= 5 and len(set(runs)) == len(runs)
          assert all(re.fullmatch(r'\d+', run) for run in runs)
          version = re.search(r'^VERSION_NAME=(.+)$', Path('nb4a.properties').read_text(), re.M)[1].strip()
          assert os.environ['RELEASE_TAG'] == 'v' + version
          notes = Path(os.environ['NOTES_PATH'])
          assert notes.is_file() and notes.resolve().is_relative_to(Path('docs/releases').resolve())
          metadata = json.loads(gh('api', f'repos/{repo}/actions/runs/{source}'))
          assert metadata['head_sha'] == expected and metadata['conclusion'] == 'success'
          assert metadata['path'] == '.github/workflows/apk.yml'
          # Harness and documentation may evolve; packaged inputs must remain identical.
          changed = subprocess.check_output(['git', 'diff', '--name-only', expected, 'HEAD'], text=True).splitlines()
          assert all(path.startswith(('docs/', '.github/scripts/', '.github/workflows/'))
                     or path == 'README.md' for path in changed), changed
          evidence_files = set()
          for run in runs:
              metadata = json.loads(gh('api', f'repos/{repo}/actions/runs/{run}'))
              assert metadata['conclusion'] == 'success' and metadata['path'] == '.github/workflows/ui.yml'
              directory = Path('verification') / run
              subprocess.run(['gh', 'run', 'download', run, '--repo', repo,
                              '-n', 'ArcaenBox-UI-verification', '-D', str(directory)], check=True)
              source_record = json.loads((directory / 'apk-source.json').read_text())
              assert source_record['id'] == int(source) and source_record['head_sha'] == expected
              assert json.loads((directory / 'failures.json').read_text()) == []
              assert json.loads((directory / 'results.json').read_text()), 'No executed UI checks'
              evidence_files.update(path.name for path in directory.rglob('*') if path.is_file())
          assert {'upgrade-results.json', 'profile-refresh-results.json', 'glass-md3-results.json',
                  'glass-focus-results.json', 'home-glass-results.json'} <= evidence_files
          assert any(name.startswith('23-restored-bottom-') and name.endswith('.png')
                     for name in evidence_files), 'Navigation restoration evidence missing'
          Path('verified-source.json').write_text(json.dumps({'source_run': source,
              'source_sha': expected, 'ui_runs': runs, 'tag': os.environ['RELEASE_TAG']}, indent=2))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ArcaenBox-APKs
          path: dist
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: Verify exact release assets and checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          expected = {f'ArcaenBox-{version}-{abi}.apk' for abi in
                      ('arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64')} | {'SHA256SUMS.txt'}
          assert {path.name for path in Path('dist').iterdir()} == expected
          PY
          cd dist
          sha256sum -c SHA256SUMS.txt
      - name: Publish the verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          NOTES_PATH: ${{ inputs.notes_path }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --target "$EXPECTED_SHA" \
            --title "ArcaenBox $RELEASE_TAG" --notes-file "$NOTES_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ArcaenBox-release-provenance
          path: verified-source.json
          if-no-files-found: warn
