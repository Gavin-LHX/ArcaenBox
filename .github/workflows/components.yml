name: ArcaenBox Native Components
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Existing verified run to publish; blank builds packages without an APK
        required: false
      component:
        type: choice
        options: [all, trojan-go, naive, mieru, snell]
        default: all
      channel:
        type: choice
        options: [all, stable, preview]
        default: all
      publish:
        type: boolean
        default: false
        description: Publish immutable updates from the existing verified source run
permissions:
  contents: write
  actions: read
jobs:
  components:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: inputs.source_run == ''
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        if: inputs.source_run == ''
        with:
          go-version: '1.25'
          cache-dependency-path: buildScript/snell-client/go.sum
      - uses: android-actions/setup-android@v3
        if: inputs.source_run == ''
      - name: Package independent Android executables
        if: inputs.source_run == ''
        env:
          KEYSTORE_PASS: ${{ secrets.ARCAENBOX_KEYSTORE_PASSWORD }}
          SIGNING_KEYSTORE: ${{ secrets.ARCAENBOX_KEYSTORE }}
        run: |
          test '${{ inputs.publish }}' = 'false'
          sdkmanager 'ndk;25.0.8775105'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.0.8775105"
          python3 -m pip install cryptography
          python3 .github/scripts/package_builtins.py
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > release.keystore
          python3 .github/scripts/package_components.py --keystore release.keystore
      - uses: actions/download-artifact@v4
        if: inputs.source_run != ''
        with:
          name: NativeComponentUpdates
          path: core-build/component-updates
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: inputs.source_run == ''
        with:
          name: NativeComponentUpdates
          path: core-build/component-updates
      - name: Publish the selected immutable channels
        if: inputs.publish && inputs.source_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          COMPONENT: ${{ inputs.component }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .conclusion)" = success
          target=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)
          python3 -m pip install cryptography
          python3 .github/scripts/publish_components.py --target "$target" --component "$COMPONENT" --channel "$CHANNEL"
