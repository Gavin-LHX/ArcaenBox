name: ArcaenBox Native Cores
on:
  workflow_dispatch:
    inputs:
      channels:
        description: JSON array of core channels to build
        default: '["stable", "preview"]'
        required: true
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(inputs.channels) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CORE_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache-dependency-path: libcore/go.sum
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1' 'ndk;25.0.8775105'
      - name: Fetch pinned sources and prepare native bridge
        run: buildScript/lib/core/init.sh
      - name: Native configuration and proxy regression tests
        run: |
          source buildScript/lib/core/get_source_env.sh
          cd libcore
          go test -v -tags "$CORE_TAGS" ./...
      - name: Compile four Android architectures
        run: buildScript/lib/core/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.channel }}
          path: |
            libcore/libcore.aar
            libcore/libcore-sources.jar
          if-no-files-found: error
