name: ArcaenBox Signed APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.4.2-arcaenbox.5
      publish:
        description: Publish the verified APKs as a release
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Remove dangling optional development link
        run: |
          if [ -L buildScript/nkmr ] && [ ! -e buildScript/nkmr ]; then
            rm buildScript/nkmr
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: libcore/go.sum
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1' 'ndk;25.0.8775105'
      - name: Cache native core
        id: core
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: arcaenbox-core-${{ runner.os }}-${{ hashFiles('libcore/**', 'buildScript/**') }}
      - name: Build native core
        if: steps.core.outputs.cache-hit != 'true'
        run: ./run lib core
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare assets
        run: ./run init action gradle
      - name: Build signed release APKs
        env:
          SIGNING_KEYSTORE: ${{ secrets.ARCAENBOX_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.ARCAENBOX_KEYSTORE_PASSWORD }}
          ALIAS_PASS: ${{ secrets.ARCAENBOX_KEYSTORE_PASSWORD }}
          ALIAS_NAME: arcaenbox
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE"
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > release.keystore
          ./gradlew --no-daemon app:testOssReleaseUnitTest app:assembleOssRelease
      - name: Verify APK signatures, application name and package
        run: |
          set -euo pipefail
          python3 -m pip install Pillow
          mkdir -p dist
          for apk in app/build/outputs/apk/oss/release/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$apk" | tee /tmp/apk-badging.txt
            grep -q "application-label:'ArcaenBox'" /tmp/apk-badging.txt
            grep -q "package: name='com.arcaenbox.android'" /tmp/apk-badging.txt
            "$ANDROID_HOME/build-tools/35.0.1/aapt" dump xmltree "$apk" AndroidManifest.xml > /tmp/apk-manifest.txt
            "$ANDROID_HOME/build-tools/35.0.1/aapt" dump --values resources "$apk" > /tmp/apk-resources.txt
            shortcuts_path=$(awk '/^[[:space:]]*resource .*:xml\/shortcuts:/ { found=1; next } found && /\(string(8|16)\)/ { split($0, parts, "\""); print parts[2]; exit }' /tmp/apk-resources.txt)
            test -n "$shortcuts_path"
            "$ANDROID_HOME/build-tools/35.0.1/aapt" dump xmltree "$apk" "$shortcuts_path" > /tmp/apk-shortcuts.txt
            grep -q 'com.arcaenbox.android.SERVICE' /tmp/apk-manifest.txt
            grep -q 'com.arcaenbox.android.cache' /tmp/apk-manifest.txt
            test "$(grep -c 'targetPackage.*com.arcaenbox.android' /tmp/apk-shortcuts.txt)" -eq 4
            if grep -F 'moe.nb4a' /tmp/apk-manifest.txt /tmp/apk-shortcuts.txt; then
              echo 'Old application ID remains in compiled resources'
              exit 1
            fi
            python3 .github/scripts/verify_icon.py "$apk"
            cp "$apk" dist/
          done
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ArcaenBox-APKs
          path: dist/*
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Verify Material 3 screens on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 .github/scripts/ui_smoke.py
      - name: Upload UI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArcaenBox-UI-verification
          path: ui-smoke/
          if-no-files-found: warn
      - name: Upload failed-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ArcaenBox-build-diagnostics
          path: |
            app/build/outputs/apk/oss/release/*.apk
            app/build/test-results/
          if-no-files-found: warn
      - name: Publish APKs
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' 'ArcaenBox for Android. Default primary color: #DCEEF1.' 'Package: com.arcaenbox.android. Can be installed alongside the old moe.nb4a application; export and import configuration to migrate.' 'Signed release APKs for arm64-v8a, armeabi-v7a, x86, and x86_64.' 'This build uses the existing dedicated ArcaenBox signing key.' > /tmp/release-notes.md
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "ArcaenBox $RELEASE_TAG" --notes-file /tmp/release-notes.md
